services:
  persistence-api:
    build: .
    image: core-ct-h1-persistence:latest
    environment:
      # Container-side listen port (keep in sync with the port mapping below).
      APP_PORT: ${APP_PORT:-8000}
    ports:
      # API_PORT selects the host port exposed to callers.
      - "${API_PORT:-8000}:${APP_PORT:-8000}"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('APP_PORT','8000')+'/health',timeout=2)" || exit 1
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
